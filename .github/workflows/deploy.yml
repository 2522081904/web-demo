name: Deploy Vue Site to GitHub Pages

# 监听 main 分支的提交：每次 push 后自动构建并发布，
# 不需要手动执行 npm run build 再提交 dist 目录。
on:
  push:
    branches: [main]
  # 支持在 Actions 页面手动触发一次部署
  workflow_dispatch:

# GitHub Pages 发布所需的权限，三者缺一不可：
#   contents: read  拉取仓库代码
#   pages: write    向 Pages 服务发布产物
#   id-token: write 通过 OIDC 完成身份认证
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一个部署任务；新的提交进来时取消尚未完成的旧任务
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # 把仓库名作为 Vite 的 base 前缀注入。
      # 项目站点地址是 https://<username>.github.io/<repo>/，
      # 因此 base 必须是 /<repo>/，否则资源路径会 404 导致白屏。
      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

      # 为 history 模式的深层地址刷新做兜底：
      # GitHub Pages 是静态托管，访问 /repo/projects/detail/1 会返回 404，
      # 把 index.html 复制成 404.html 后，Pages 会用这个页面响应，
      # 路由再根据地址栏把用户送回正确的页面。
      - name: Add SPA fallback for history mode
        run: cp dist/index.html dist/404.html

      # 关闭 Jekyll 处理，避免以 _ 开头的资源目录被忽略
      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
